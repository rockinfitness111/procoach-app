<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCoach System (Mobile Optimized)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .chart-container { position: relative; width: 100%; max-width: 100%; height: 300px; margin: 0 auto; }
        @media (min-width: 768px) { .chart-container { height: 350px; } }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .btn-action { position: relative; z-index: 10; cursor: pointer; }
        
        /* Mobile Overlay Transition */
        #mobile-overlay { transition: opacity 0.3s ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased overflow-hidden h-screen flex flex-col md:flex-row relative">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-900 z-[100] flex flex-col items-center justify-center text-white transition-opacity duration-500">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500 border-opacity-50"></div>
        <p id="loading-text" class="mt-4 text-lg font-bold tracking-wider">系統載入中...</p>
    </div>

    <!-- Mobile Header -->
    <div class="md:hidden bg-slate-900 text-white p-4 flex justify-between items-center shrink-0 z-40 relative shadow-md">
        <div class="font-bold text-lg tracking-wider flex items-center gap-2">
            <span class="bg-blue-600 p-1 rounded text-white" id="mobile-logo-icon"></span>
            ProCoach Cloud
        </div>
        <button id="mobile-menu-btn" class="text-slate-300 hover:text-white focus:outline-none p-2 rounded hover:bg-slate-800 transition-colors">
            <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        </button>
    </div>

    <!-- Mobile Overlay (Dark background when menu is open) -->
    <div id="mobile-overlay" class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm" onclick="window.toggleSidebar()"></div>

    <!-- Sidebar -->
    <nav id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full md:translate-x-0 md:static md:flex w-64 bg-slate-900 text-white flex-col shrink-0 h-full transition-transform duration-300 z-50 shadow-2xl md:shadow-none">
        <div class="p-6 text-xl font-bold tracking-wider flex items-center justify-between border-b border-slate-700">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white" id="sidebar-logo-icon"></div>
                ProCoach
            </div>
            <!-- Mobile Close Button -->
            <button onclick="window.toggleSidebar()" class="md:hidden text-slate-400 hover:text-white p-1 rounded hover:bg-slate-800 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div class="flex-1 overflow-y-auto py-4 px-3 space-y-1" id="nav-items">
            <!-- Nav Items Injected by JS -->
        </div>

        <div class="p-4 border-t border-slate-700 text-slate-400 text-xs text-center" id="system-status">
            <span class="flex items-center justify-center gap-1 text-yellow-400">● 初始化中</span>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-1 overflow-hidden flex flex-col relative w-full bg-slate-50">
        <header class="bg-white border-b border-slate-200 px-4 py-4 md:px-8 md:py-5 shrink-0 flex flex-col md:flex-row justify-between md:items-start gap-4 shadow-sm z-30 relative">
            <div>
                <h1 id="page-title" class="text-xl md:text-2xl font-bold text-slate-800">營運總覽</h1>
                <p id="page-desc" class="text-xs md:text-sm text-slate-500 mt-1">檢視本月各館績效與續約提醒</p>
            </div>
            <div id="header-actions" class="flex gap-2 self-end md:self-auto"></div>
        </header>
        <div id="app-content" class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 pb-20 md:pb-8"></div>
    </main>

    <!-- Modal -->
    <div id="modal-overlay" class="fixed inset-0 bg-black/60 hidden z-[60] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
        <div id="modal-content" class="bg-white rounded-xl shadow-2xl w-full max-w-md max-h-[90vh] overflow-y-auto animate-fade-in ring-1 ring-slate-900/5"></div>
    </div>

    <!-- Firebase SDK & Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, query, orderBy, arrayUnion } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // ============================================================
        // ★★★ 請將您的 Firebase Config 貼在下方 ★★★
        // ★★★ 請保留這個區塊，將您自己的資料貼進去 ★★★
        // ============================================================
        const firebaseConfig = {
            // 請替換成您從 Firebase Console 複製的內容
            apiKey: "AIzaSyBea_6v0vAu8zmI7_f4axpSJkII1IJyZFw",
            authDomain: "procoach-system.firebaseapp.com",
            projectId: "procoach-system",
            storageBucket: "procoach-system.firebasestorage.app",
            messagingSenderId: "802837137944",
            appId: "1:802837137944:web:c845878c8900db230d916d"
        };
        // ============================================================

        // --- ICONS & HELPERS ---
        const icons = {
            trending: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path></svg>',
            calendar: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>',
            users: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>',
            briefcase: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>',
            settings: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>',
            alert: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>',
            plus: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>',
            search: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>',
            clock: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>',
            external: '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>',
            trash: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>',
            grad: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222"/></svg>',
            close: '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>',
            save: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>',
            edit: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>',
            fileUp: '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>'
        };

        window.icons = icons;
        window.getStudentTotal = (s) => !s.purchaseHistory ? 0 : s.purchaseHistory.reduce((sum, p) => sum + (parseInt(p.amount) || 0), 0);
        window.calculateAge = (d) => { if (!d) return 0; const today = new Date(); const b = new Date(d); let age = today.getFullYear() - b.getFullYear(); const m = today.getMonth() - b.getMonth(); if (m < 0 || (m === 0 && today.getDate() < b.getDate())) age--; return age; };
        window.generateCalendarUrl = (b, sName) => { const start = new Date(`${b.date}T${b.time}`).toISOString().replace(/-|:|\.\d\d\d/g, ""); const end = new Date(new Date(`${b.date}T${b.time}`).getTime() + (b.duration || 60) * 60000).toISOString().replace(/-|:|\.\d\d\d/g, ""); const d = `學員: ${sName}%0A教練: ${b.coach}%0A備註: ${b.notes || '無'}`; return `https://www.google.com/calendar/render?action=TEMPLATE&text=健身課程: ${sName}&dates=${start}/${end}&details=${d}&location=${b.venue}`; };

        // --- GLOBAL STATE ---
        window.state = { view: 'dashboard', coaches: [], students: [], bookings: [], isOfflineMode: false };
        window.currentModalContext = { studentId: null, tab: 'info', isEditing: false };

        // --- MOBILE MENU LOGIC (New Optimized) ---
        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobile-overlay');
            const isOpen = !sidebar.classList.contains('-translate-x-full');
            
            if (isOpen) {
                // Close
                sidebar.classList.add('-translate-x-full');
                overlay.classList.add('hidden');
            } else {
                // Open
                sidebar.classList.remove('-translate-x-full');
                overlay.classList.remove('hidden');
            }
        };

        // Initialize Mobile Menu Button
        document.getElementById('mobile-menu-btn').addEventListener('click', window.toggleSidebar);

        // --- FIREBASE INIT ---
        let app, auth, db;
        async function initApp() {
            const loadingText = document.getElementById('loading-text');
            const statusEl = document.getElementById('system-status');
            if(document.getElementById('mobile-logo-icon')) document.getElementById('mobile-logo-icon').innerHTML = icons.trending;
            if(document.getElementById('sidebar-logo-icon')) document.getElementById('sidebar-logo-icon').innerHTML = icons.trending;

            try {
                app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                await signInAnonymously(auth);
                
                const qCoaches = query(collection(db, "coaches"), orderBy("createdAt"));
                const qStudents = query(collection(db, "students"));
                const qBookings = query(collection(db, "bookings"));

                onSnapshot(qCoaches, (s) => { window.state.coaches = s.docs.map(d => ({ id: d.id, ...d.data() })); refreshCurrentView(); });
                onSnapshot(qStudents, (s) => { window.state.students = s.docs.map(d => ({ id: d.id, ...d.data() })); refreshCurrentView(); });
                onSnapshot(qBookings, (s) => { window.state.bookings = s.docs.map(d => ({ id: d.id, ...d.data() })); refreshCurrentView(); hideLoading(); });

                statusEl.innerHTML = `<span class="flex items-center justify-center gap-1 text-emerald-400">● 雲端連線中</span> v4.5 Mobile`;
            } catch (error) {
                handleFirebaseError(error);
            }
        }

        function handleFirebaseError(error) {
            console.warn("Offline Mode:", error.message);
            window.state.isOfflineMode = true;
            loadMockData();
            document.getElementById('system-status').innerHTML = `<span class="flex items-center justify-center gap-1 text-orange-400">● 離線展示模式</span> v4.5 Offline`;
            if (!window.hasAlertedError) {
                alert("檢測到 Firebase 未設定，已切換至離線模式。");
                window.hasAlertedError = true;
            }
            hideLoading();
            refreshCurrentView();
        }

        function hideLoading() { document.getElementById('loading-screen').classList.add('opacity-0', 'pointer-events-none'); }
        function loadMockData() {
            const p = new Date().toISOString().slice(0, 7);
            window.state.coaches = [{ id: 'c1', name: '王大明', createdAt: '2023-01-10' }, { id: 'c2', name: '李曉華', createdAt: '2023-02-15' }];
            window.state.students = [{ id: 's1', name: '張小美', phone: '0912345678', gender: '女', birthDate: '1995-05-12', mainVenue: '民生店', assignedCoach: '王大明', isGraduated: false, createdAt: '2024-09-01', usedSessions: 8, purchaseHistory: [{date: '2024-09-01', amount: 10, price: 15000}] }];
            window.state.bookings = [{ id: 'b1', studentId: 's1', coach: '王大明', venue: '民生店', date: `${p}-05`, time: '19:00', duration: 60, notes: '深蹲調整' }];
        }

        function refreshCurrentView() {
            window.switchView(window.state.view, false);
            if(!document.getElementById('modal-overlay').classList.contains('hidden') && window.currentModalContext.studentId) window.renderModalContent();
        }

        // --- ACTIONS ---
        window.Actions = {
            deleteStudent: async (sid) => {
                if(!confirm("確定刪除？")) return;
                if(window.state.isOfflineMode) { window.state.students = window.state.students.filter(x=>x.id!==sid); window.closeModal(); refreshCurrentView(); }
                else { await deleteDoc(doc(db, "students", sid)); window.closeModal(); }
            },
            deleteBooking: async (bid) => {
                if(!confirm("確定取消？")) return;
                if(window.state.isOfflineMode) { window.state.bookings = window.state.bookings.filter(x=>x.id!==bid); refreshCurrentView(); }
                else { 
                    const b = window.state.bookings.find(x=>x.id===bid);
                    if(b) { const s = window.state.students.find(stu=>stu.id===b.studentId); if(s) await updateDoc(doc(db, "students", s.id), { usedSessions: s.usedSessions - 1 }); }
                    await deleteDoc(doc(db, "bookings", bid)); 
                }
            },
            deleteCoach: async (cid) => { if(confirm("確定刪除？")) window.state.isOfflineMode ? (window.state.coaches=window.state.coaches.filter(c=>c.id!==cid), refreshCurrentView()) : await deleteDoc(doc(db, "coaches", cid)); },
            deletePurchase: async (sid, idx) => { if(confirm("確定刪除？")) window.state.isOfflineMode ? (window.state.students.find(s=>s.id===sid).purchaseHistory.splice(idx,1), window.renderModalContent()) : await updateDoc(doc(db,"students",sid),{ purchaseHistory: window.state.students.find(s=>s.id===sid).purchaseHistory.filter((_,i)=>i!==idx) }); },
            openStudentDetail: (sid) => { window.currentModalContext = { studentId: sid, tab: 'info', isEditing: false }; window.renderModalContent(); document.getElementById('modal-overlay').classList.remove('hidden'); },
            
            // Add/Edit
            handleAddStudent: async (fd) => {
                const n = { name: fd.get('name'), phone: fd.get('phone'), gender: fd.get('gender'), birthDate: fd.get('birthDate'), mainVenue: fd.get('mainVenue'), assignedCoach: fd.get('assignedCoach'), createdAt: fd.get('purchaseDate'), usedSessions: 0, isGraduated: false, purchaseHistory: [{ date: fd.get('purchaseDate'), amount: parseInt(fd.get('amount')), price: parseInt(fd.get('price')) || 0, note: '首次購買' }] };
                if(window.state.isOfflineMode) { n.id='s'+Date.now(); window.state.students.unshift(n); window.closeModal(); refreshCurrentView(); }
                else { await addDoc(collection(db, "students"), n); window.closeModal(); }
            },
            handleAddBooking: async (fd, sid) => {
                const b = { studentId: sid, venue: fd.get('venue'), coach: fd.get('coach'), date: fd.get('date'), time: fd.get('time'), duration: parseInt(fd.get('duration'))||60, notes: fd.get('notes'), createdAt: new Date().toISOString() };
                if(window.state.isOfflineMode) { b.id='b'+Date.now(); window.state.bookings.push(b); window.state.students.find(s=>s.id===sid).usedSessions++; window.closeModal(); refreshCurrentView(); }
                else { await addDoc(collection(db, "bookings"), b); const s=window.state.students.find(x=>x.id===sid); if(s) await updateDoc(doc(db,"students",s.id),{usedSessions: (s.usedSessions||0)+1}); window.closeModal(); }
                if(confirm("預約成功！開啟 Google 日曆？")) window.open(generateCalendarUrl(b, window.state.students.find(s=>s.id===sid).name), '_blank');
            },
            handleAddCoach: async (n) => window.state.isOfflineMode ? (window.state.coaches.push({id:'c'+Date.now(),name:n,createdAt:new Date().toISOString().slice(0,10)}), refreshCurrentView()) : await addDoc(collection(db,"coaches"),{name:n,createdAt:new Date().toISOString().slice(0,10)}),
            handleSaveStudentInfo: async (fd) => {
                const u = { name: fd.get('name'), phone: fd.get('phone'), birthDate: fd.get('birthDate'), mainVenue: fd.get('mainVenue'), assignedCoach: fd.get('assignedCoach'), isGraduated: fd.get('isGraduated')==='on' };
                if(window.state.isOfflineMode) { Object.assign(window.state.students.find(s=>s.id===window.currentModalContext.studentId), u); window.currentModalContext.isEditing=false; window.renderModalContent(); refreshCurrentView(); }
                else { await updateDoc(doc(db,"students",window.currentModalContext.studentId), u); window.currentModalContext.isEditing=false; }
            },
            handleAddPurchase: async (fd, sid) => {
                const p = { date: fd.get('date'), amount: parseInt(fd.get('amount')), price: parseInt(fd.get('price'))||0, note: fd.get('note') };
                window.state.isOfflineMode ? (window.state.students.find(s=>s.id===sid).purchaseHistory.push(p), window.renderModalContent()) : await updateDoc(doc(db,"students",sid),{purchaseHistory: arrayUnion(p)});
                alert("已新增");
            }
        };

        // Event Delegation
        document.addEventListener('click', function(e) {
            const t = e.target.closest('[data-action]');
            if (!t) return;
            e.stopPropagation();
            const { action, id, idx } = t.dataset;
            if (Actions[action.replace(/-([a-z])/g, (g) => g[1].toUpperCase())]) { // convert kebab to camel e.g. delete-student -> deleteStudent
                if(action === 'delete-purchase') Actions.deletePurchase(id, idx);
                else if(action === 'view-student') Actions.openStudentDetail(id);
                else Actions[action.replace(/-([a-z])/g, (g) => g[1].toUpperCase())](id);
            }
        });

        // VIEW & RENDER
        window.renderNav = function() {
            const items = [
                { id: 'dashboard', label: '1. 營運總覽', icon: icons.trending },
                { id: 'schedule', label: '2. 課程日程', icon: icons.calendar },
                { id: 'students', label: '3. 學員名單', icon: icons.users },
                { id: 'coaches', label: '4. 教練群', icon: icons.briefcase },
                { id: 'settings', label: '5. 資料設定', icon: icons.settings },
            ];
            document.getElementById('nav-items').innerHTML = items.map(i => `
                <button onclick="window.switchView('${i.id}')" 
                    class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors mb-1 
                    ${window.state.view === i.id ? 'bg-blue-600 text-white shadow-lg' : 'text-slate-300 hover:bg-slate-800 hover:text-white'}">
                    ${i.icon} ${i.label}
                </button>
            `).join('');
        };

        window.switchView = function(viewId, reset = true) {
            if(reset) window.state.view = viewId;
            window.renderNav();
            
            // Auto close sidebar on mobile when switching views
            if (window.innerWidth < 768) {
                const sidebar = document.getElementById('sidebar');
                if (!sidebar.classList.contains('-translate-x-full')) {
                    window.toggleSidebar();
                }
            }
            
            const titles = { 'dashboard': '營運總覽', 'schedule': '課程日程', 'students': '學員名單', 'coaches': '教練群', 'settings': '系統設定' };
            document.getElementById('page-title').innerText = titles[viewId];
            
            const content = document.getElementById('app-content');
            const actions = document.getElementById('header-actions');
            actions.innerHTML = '';
            
            if (viewId === 'dashboard') window.renderDashboard(content);
            else if (viewId === 'schedule') window.renderSchedule(content, actions);
            else if (viewId === 'students') window.renderStudents(content, actions);
            else if (viewId === 'coaches') window.renderCoaches(content, actions);
            else if (viewId === 'settings') window.renderSettings(content);
        };

        // Render Functions
        window.renderDashboard = function(c) {
            const p = new Date().toISOString().slice(0, 7);
            const b = window.state.bookings.filter(x => x.date.startsWith(p));
            const renew = window.state.students.filter(s => !s.isGraduated && (getStudentTotal(s)-s.usedSessions)<=3);
            c.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-emerald-500"></div><p class="text-xs text-slate-500">民生店 (本月)</p><h3 class="text-2xl font-bold text-slate-800 mt-1">${b.filter(x=>x.venue==='民生店').length} <span class="text-xs font-normal text-slate-400">堂</span></h3></div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 relative overflow-hidden"><div class="absolute top-0 left-0 w-1 h-full bg-orange-500"></div><p class="text-xs text-slate-500">經國店 (本月)</p><h3 class="text-2xl font-bold text-slate-800 mt-1">${b.filter(x=>x.venue==='經國店').length} <span class="text-xs font-normal text-slate-400">堂</span></h3></div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200"><p class="text-xs text-slate-500">總學員</p><h3 class="text-2xl font-bold text-slate-800 mt-1">${window.state.students.length} <span class="text-xs font-normal text-slate-400">人</span></h3></div>
                </div>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col h-[350px]">
                        <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-red-50"><h3 class="font-bold text-red-800 text-sm flex items-center gap-2">${icons.alert} 續約提醒</h3><span class="text-xs bg-white text-red-600 px-2 py-1 rounded-full font-bold border border-red-100">${renew.length}</span></div>
                        <div class="overflow-y-auto flex-1"><table class="w-full text-left text-xs md:text-sm"><thead class="bg-slate-50 sticky top-0"><tr><th class="px-4 py-2">姓名</th><th class="px-4 py-2">電話</th><th class="px-4 py-2">剩餘</th></tr></thead><tbody class="divide-y divide-slate-100">${renew.map(s => `<tr class="hover:bg-slate-50"><td class="px-4 py-3 font-medium">${s.name}</td><td class="px-4 py-3 text-slate-500 font-mono">${s.phone}</td><td class="px-4 py-3 font-bold text-red-600">${getStudentTotal(s) - s.usedSessions}</td></tr>`).join('') || `<tr><td colspan="3" class="p-6 text-center text-slate-400">無</td></tr>`}</tbody></table></div>
                    </div>
                    <div class="bg-white rounded-xl shadow-sm border border-slate-200 h-[350px] flex flex-col"><div class="p-4 border-b border-slate-100"><h3 class="font-bold text-slate-800 text-sm">教練課量</h3></div><div class="flex-1 p-2 flex items-center justify-center"><div class="chart-container"><canvas id="coachChart"></canvas></div></div></div>
                </div>`;
            const ctx = document.getElementById('coachChart').getContext('2d');
            const cd = window.state.coaches.map(c => ({ name: c.name, count: b.filter(x => x.coach === c.name).length })).sort((a,b)=>b.count-a.count);
            if(window.myChart) window.myChart.destroy();
            window.myChart = new Chart(ctx, { type: 'bar', data: { labels: cd.map(d=>d.name), datasets: [{ label: '堂數', data: cd.map(d=>d.count), backgroundColor: '#3b82f6', borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }, plugins: { legend: { display: false } } } });
        };

        window.renderSchedule = function(c, a) {
            a.innerHTML = `<button onclick="window.openBookingModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg shadow-md flex items-center gap-2 text-xs md:text-sm font-bold transition-colors">${icons.plus} 預約</button>`;
            c.innerHTML = `<div class="bg-white p-3 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-3 mb-4"><div class="relative flex-1"><span class="absolute left-3 top-2.5 text-slate-400">${icons.search}</span><input id="sched-search" placeholder="搜尋學員..." class="w-full pl-9 pr-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" oninput="window.updateScheduleList()"></div><div class="flex gap-2"><select id="sched-venue" class="border border-slate-300 rounded-lg px-2 py-2 text-sm bg-white" onchange="window.updateScheduleList()"><option value="All">全館</option><option value="民生店">民生</option><option value="經國店">經國</option></select><select id="sched-coach" class="border border-slate-300 rounded-lg px-2 py-2 text-sm bg-white" onchange="window.updateScheduleList()"><option value="All">全教練</option>${window.state.coaches.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}</select></div></div><div id="schedule-list" class="space-y-6"></div>`;
            window.updateScheduleList();
        };

        window.updateScheduleList = function() {
            const sVal = document.getElementById('sched-search')?.value.toLowerCase()||'', vVal = document.getElementById('sched-venue')?.value||'All', cVal = document.getElementById('sched-coach')?.value||'All';
            const filt = window.state.bookings.filter(b => { const s = window.state.students.find(x=>x.id===b.studentId); return (vVal==='All'||b.venue===vVal) && (cVal==='All'||b.coach===cVal) && (s?.name.toLowerCase().includes(sVal)); }).sort((a,b) => new Date(a.date+'T'+a.time)-new Date(b.date+'T'+b.time));
            const grp = filt.reduce((acc,b)=>{ (acc[b.date]=acc[b.date]||[]).push(b); return acc; }, {});
            const el = document.getElementById('schedule-list');
            if(filt.length===0) return el.innerHTML = `<div class="text-center py-12 text-slate-400">無資料</div>`;
            el.innerHTML = Object.keys(grp).sort().map(d => {
                const times = grp[d].reduce((acc,b)=>{ (acc[b.time]=acc[b.time]||[]).push(b); return acc; }, {});
                return `<div class="mb-6"><div class="flex items-center gap-4 mb-3"><div class="h-px bg-slate-200 flex-1"></div><div class="text-xs font-bold text-slate-500 bg-slate-100 px-3 py-1 rounded-full">${d}</div><div class="h-px bg-slate-200 flex-1"></div></div><div class="space-y-4">${Object.keys(times).sort().map(t => `<div class="flex gap-3"><div class="w-14 shrink-0 text-center"><div class="font-bold text-blue-600 text-sm bg-blue-50 px-1 py-1 rounded border border-blue-100">${t}</div></div><div class="flex-1 space-y-3">${times[t].map(b => { const s = window.state.students.find(x=>x.id===b.studentId); return `<div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm relative"><div class="flex justify-between items-start mb-1"><span class="text-[10px] text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded">${b.duration}m</span><div class="flex gap-2"><span class="text-[10px] px-1.5 py-0.5 rounded border ${b.venue==='民生店'?'bg-emerald-50 text-emerald-700 border-emerald-100':'bg-orange-50 text-orange-700 border-orange-100'}">${b.venue}</span><button type="button" data-action="delete-booking" data-id="${b.id}" class="text-slate-400 hover:text-red-500">${icons.trash}</button></div></div><h4 class="font-bold text-base text-slate-800">${s?.name||'未知'}</h4><p class="text-xs text-slate-500 mt-1 flex items-center gap-1">${icons.users} 教練: ${b.coach}</p></div>`; }).join('')}</div></div>`).join('')}</div></div>`;
            }).join('');
        };

        window.renderStudents = function(c, a) {
            a.innerHTML = `<button onclick="window.openStudentModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg shadow-md flex items-center gap-2 text-xs md:text-sm font-bold transition-colors">${icons.plus} 新增</button>`;
            c.innerHTML = `<div class="flex flex-col gap-3 mb-4"><div class="flex gap-2"><select id="stu-venue" onchange="window.updateStudentList()" class="border border-slate-300 rounded-lg px-2 py-2 text-sm bg-white"><option value="All">全館</option><option value="民生店">民生</option><option value="經國店">經國</option></select><input id="stu-search" oninput="window.updateStudentList()" class="border border-slate-300 rounded-lg px-3 py-2 text-sm w-full focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="搜尋姓名/電話..."></div></div><div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm"><table class="w-full text-left text-sm"><thead class="bg-slate-50 border-b border-slate-100"><tr><th class="px-4 py-3 font-semibold text-slate-600">姓名</th><th class="px-4 py-3 font-semibold text-slate-600">狀態</th><th class="hidden md:table-cell px-4 py-3 font-semibold text-slate-600">電話</th><th class="hidden md:table-cell px-4 py-3 font-semibold text-slate-600">教練</th><th class="px-4 py-3 text-center">操作</th></tr></thead><tbody id="student-list-body" class="divide-y divide-slate-100"></tbody></table></div>`;
            window.updateStudentList();
        };

        window.updateStudentList = function() {
            const v = document.getElementById('stu-venue')?.value||'All', s = document.getElementById('stu-search')?.value.toLowerCase()||'';
            const d = window.state.students.filter(x => (v==='All'||x.mainVenue===v) && (x.name.includes(s)||x.phone.includes(s))).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
            document.getElementById('student-list-body').innerHTML = d.map(x => {
                const rem = getStudentTotal(x)-x.usedSessions;
                const low = !x.isGraduated && rem<=3;
                return `<tr class="hover:bg-blue-50/50 cursor-pointer" onclick="Actions.openStudentDetail('${x.id}')"><td class="px-4 py-3"><div class="font-bold text-slate-800">${x.name}</div><div class="text-xs text-slate-400 md:hidden">${x.mainVenue}</div></td><td class="px-4 py-3"><div class="flex flex-col"><span class="font-bold ${low?'text-red-600':'text-slate-800'}">${rem}堂</span><span class="text-[10px] text-slate-400">${x.isGraduated?'已畢業':'剩餘'}</span></div></td><td class="hidden md:table-cell px-4 py-3 font-mono text-slate-600">${x.phone}</td><td class="hidden md:table-cell px-4 py-3 text-slate-600">${x.assignedCoach||'-'}</td><td class="px-4 py-3 text-center"><button onclick="event.stopPropagation(); Actions.deleteStudent('${x.id}')" class="text-slate-300 hover:text-red-500">${icons.trash}</button></td></tr>`;
            }).join('');
        };

        window.renderCoaches = function(c, a) {
            a.innerHTML = `<button onclick="window.openCoachModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-3 py-1.5 md:px-4 md:py-2 rounded-lg shadow-md flex items-center gap-2 text-xs md:text-sm font-bold transition-colors">${icons.plus} 新增</button>`;
            const bm = window.state.bookings.filter(x => x.date.startsWith(new Date().toISOString().slice(0, 7)));
            c.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${window.state.coaches.map(k => {
                const count = bm.filter(x => x.coach === k.name).length;
                return `<div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm relative"><button onclick="Actions.deleteCoach('${k.id}')" class="absolute top-4 right-4 text-slate-300 hover:text-red-500">${icons.trash}</button><div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 bg-slate-100 rounded-full flex items-center justify-center font-bold text-slate-600">${k.name[0]}</div><h3 class="font-bold text-slate-800">${k.name}</h3></div><div class="text-sm border-t pt-3 flex justify-between"><span class="text-slate-500">本月課量</span><span class="font-bold text-blue-600">${count} 堂</span></div></div>`;
            }).join('')}</div>`;
        };

        window.renderSettings = function(c) { c.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm"><h2 class="font-bold text-lg mb-4 flex items-center gap-2">${icons.settings} 設定</h2><div class="flex items-center justify-between p-3 bg-slate-50 rounded border border-slate-100"><div><h3 class="font-bold text-slate-800 text-sm">匯入 Excel</h3><p class="text-xs text-slate-500">批次建立學員</p></div><button onclick="window.openImportModal()" class="bg-white border border-slate-300 px-3 py-1.5 rounded text-xs font-medium">${icons.fileUp} 匯入</button></div></div>`; };

        // --- MODALS ---
        window.closeModal = function() { document.getElementById('modal-overlay').classList.add('hidden'); window.currentModalContext = { studentId: null, tab: 'info', isEditing: false }; };
        window.openBookingModal = function() {
            document.getElementById('modal-content').innerHTML = `<div class="p-5"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">新增預約</h3><button onclick="window.closeModal()" class="text-slate-400">${icons.close}</button></div><form onsubmit="Actions.handleAddBooking(new FormData(this), document.getElementById('book-student').value); return false;" class="space-y-4"><div><label class="text-xs font-bold text-slate-500 block mb-1">學員</label><select id="book-student" class="w-full border rounded p-2 text-sm bg-slate-50" required onchange="const s=this.options[this.selectedIndex]; if(s.dataset.c && s.dataset.c!=='undefined') document.getElementById('book-coach').value=s.dataset.c;"><option value="">請選擇</option>${window.state.students.map(s => `<option value="${s.id}" data-c="${s.assignedCoach}">${s.name} (餘:${getStudentTotal(s)-s.usedSessions})</option>`).join('')}</select></div><div class="grid grid-cols-2 gap-3"><div><label class="text-xs font-bold text-slate-500 block mb-1">場館</label><select name="venue" class="w-full border rounded p-2 text-sm bg-slate-50"><option value="民生店">民生店</option><option value="經國店">經國店</option></select></div><div><label class="text-xs font-bold text-slate-500 block mb-1">教練</label><select id="book-coach" name="coach" class="w-full border rounded p-2 text-sm bg-slate-50" required><option value="">請選擇</option>${window.state.coaches.map(c => `<option value="${c.name}">${c.name}</option>`).join('')}</select></div></div><div class="grid grid-cols-2 gap-3"><input type="date" name="date" class="border rounded p-2 text-sm" required value="${new Date().toISOString().slice(0,10)}"><input type="time" name="time" class="border rounded p-2 text-sm" required value="19:00"></div><input name="notes" placeholder="備註 (選填)" class="w-full border rounded p-2 text-sm"><button type="submit" class="w-full py-2.5 bg-blue-600 text-white rounded-lg font-bold shadow-md">確認預約</button></form></div>`;
            document.getElementById('modal-overlay').classList.remove('hidden');
        };
        window.openStudentModal = function() {
            document.getElementById('modal-content').innerHTML = `<div class="p-5"><h3 class="font-bold text-lg mb-4">新增學員</h3><form onsubmit="Actions.handleAddStudent(new FormData(this)); return false;" class="space-y-3"><input name="name" placeholder="姓名 *" class="w-full border
